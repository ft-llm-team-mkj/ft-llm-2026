sft:
  max_num_epochs: 1
  max_num_steps: -1  # -1 means use epochs

  val_period: 500
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: true
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "results/sft_nemo_rl"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 500
  checkpoint_must_save_by: null

policy:
  model_name: "ft-llm-team-mkj/baseline-model-instruct"
  tokenizer:
    name: ${policy.model_name}
    # Use default chat template from tokenizer
    chat_template: "default"
    chat_template_kwargs: null
  train_global_batch_size: 64
  train_micro_batch_size: 1
  max_total_sequence_length: 4096
  precision: "bfloat16"

  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: true
    env_vars: {}
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true  # Enable for memory efficiency
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

    # LoRA disabled for full parameter fine-tuning
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: true

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 2.0e-5
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1e-5
      foreach: false
      fused: false

  megatron_cfg:
    enabled: false
    env_vars: {}

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 4

  # OpenAI format dataset from HuggingFace
  dataset_name: "openai_format"
  train_data_path: "ft-llm-team-mkj/stackmath-translation-jaen-llmjp"
  val_data_path: "ft-llm-team-mkj/stackmath-translation-jaen-llmjp"
  train_split: "train"
  val_split: "test"
  chat_key: "messages"
  system_key: null
  system_prompt: null
  tool_key: null
  use_preserving_dataset: false

logger:
  log_dir: "logs"
  wandb_enabled: true
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "ft-llm-2026-sft"
    name: "sft-stackmath-${now:%Y%m%d_%H%M%S}"
  tensorboard:
    log_dir: "tb_logs-sft-stackmath"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8  # Adjust based on your environment
  num_nodes: 1
